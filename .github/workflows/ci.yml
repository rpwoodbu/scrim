name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Run all tests (including performance validation)
        run: bazel test //... //tests:performance_validation_test

      - name: Build release binaries
        run: |
          bazel build -c opt --stamp --config=linux-x86_64 --remote_download_toplevel //src/bin:scrim
          cp bazel-bin/src/bin/scrim scrim-linux-x86_64
          chmod +x scrim-linux-x86_64

          bazel build -c opt --stamp --config=linux-aarch64 --remote_download_toplevel //src/bin:scrim
          cp bazel-bin/src/bin/scrim scrim-linux-aarch64
          chmod +x scrim-linux-aarch64

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            scrim-linux-x86_64
            scrim-linux-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
